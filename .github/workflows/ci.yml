name: C/C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get install -y build-essential doxygen
      - name: make
        run: make gtest
      - name: Chmod
        run: chmod +x ./gtest
      - name: Run image processor
        run: ./gtest
